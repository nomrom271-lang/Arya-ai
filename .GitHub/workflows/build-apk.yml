name: Build AryaAI APK

# Is workflow se APK GitHub ke cloud me banta hai.
# User ko apne phone/PC par Android Studio (1.5 GB) download nahi karna padta.
# Sirf source files GitHub repo me dalo, Actions khud APK bana dega.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout karo
        uses: actions/checkout@v4

      - name: Java 17 set karo
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.2 set karo
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Debug APK banao
        run: gradle assembleDebug --stacktrace

      - name: APK artifact ke roop me save karo
        uses: actions/upload-artifact@v4
        with:
          name: AryaAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
